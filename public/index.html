<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Primary SEO -->
    <title>SINUO — Fragrance for the in-between</title>
    <meta
      name="description"
      content="SINUO blends roots and future through scent. Clean, sharp, emotionally warm fragrances for young creators living between cultures."
    />
    <meta
      name="keywords"
      content="SINUO, perfume, fragrance, niche fragrance, diaspora, culture, luxury, minimalist, Spain, young, streetwear, art"
    />
    <meta name="author" content="SINUO" />
    <meta name="robots" content="index,follow" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme (mobile UI color) -->
    <meta name="theme-color" content="#4e0808" />
    <meta name="color-scheme" content="dark light" />

    <!-- Canonical (set your real domain) -->
    <link rel="canonical" href="https://sinuo.es/" />

    <!-- Favicon / App icons -->
    <link rel="icon" href="%PUBLIC_URL%/assets/images/logoSmall.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/images/logoSmall.png" />
    <!-- Optional: add a 180x180 png for best iOS -->
    <!-- <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/assets/icons/apple-touch-icon.png" /> -->

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="application-name" content="SINUO" />
    <meta name="apple-mobile-web-app-title" content="SINUO" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph (Facebook/WhatsApp/iMessage/etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SINUO" />
    <meta property="og:title" content="SINUO — Fragrance for the in-between" />
    <meta
      property="og:description"
      content="Clean, sharp, emotionally warm. Scent that merges worlds and brings memories back."
    />
    <meta property="og:url" content="https://sinuo.es/" />
    <meta property="og:image" content="https://sinuo.es/assets/og/sinuo-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SINUO — perfumes" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SINUO — Fragrance for the in-between" />
    <meta
      name="twitter:description"
      content="Clean, sharp, emotionally warm. Scent that merges worlds and brings memories back."
    />
    <meta name="twitter:image" content="https://sinuo.es/assets/og/sinuo-og.jpg" />

    <!-- Optional: if you have a @handle -->
    <!-- <meta name="twitter:site" content="@sinuo" /> -->

    <!-- Performance niceties -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- If you load any external fonts/CDN, add preconnect for those domains too -->

    <!-- Social “square” fallback (optional) -->
    <meta property="og:image" content="https://sinuo.es/assets/og/sinuo-og-square.jpg" />

    <!-- If you want a super clean share line in some apps -->
    <meta name="apple-itunes-app" content="app-id=none" />
  </head>
  <body>
    <noscript>SINUO needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
  </body>
</html>
